name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🎨 Check formatting
        run: npm run format-check

      - name: 🧪 Test
        run: npm test

      - name: 🏗️ Build
        run: npm run build

      # The action runs dist/index.js, not src/. If dist/ is not rebuilt and
      # committed with the source change, the fix never reaches users - which is
      # exactly how the unclosed <tbody> bug shipped upstream in v2.3.11.
      - name: 🔍 Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git status --short -- dist/
            git --no-pager diff --stat -- dist/
            exit 1
          fi
          echo "dist/ is up to date."
